[workspace]
members = [
    "crates/ldrive-proto",
    "crates/ldrive-common",
    "crates/ldrive-chunk",
    "crates/ldrive-store",
    "crates/ldrive-net",
    "crates/ldrive-dht",
    "crates/ldrive-incentive",
    "crates/ldrive-pqc",
    "crates/ldrive-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# networking
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = "0.13"

# serialization
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"

# hashing & chunking
blake3 = "1"
fastcdc = "3"
reed-solomon-erasure = "6"

# storage
redb = "2"

# cli
clap = { version = "4", features = ["derive"] }

# error handling & logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# utilities
bytes = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# workspace crates
ldrive-proto = { path = "crates/ldrive-proto" }
ldrive-common = { path = "crates/ldrive-common" }
ldrive-chunk = { path = "crates/ldrive-chunk" }
ldrive-store = { path = "crates/ldrive-store" }
ldrive-net = { path = "crates/ldrive-net" }
ldrive-dht = { path = "crates/ldrive-dht" }
