name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: ldrive-node-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: ldrive-node-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: ldrive-node-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: ldrive-node-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: ldrive-node-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p ldrive-node

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/ldrive-node${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ldrive-node-linux-x86_64/ldrive-node
            ldrive-node-linux-aarch64/ldrive-node
            ldrive-node-macos-x86_64/ldrive-node
            ldrive-node-macos-aarch64/ldrive-node
            ldrive-node-windows-x86_64.exe/ldrive-node.exe
          draft: false
          prerelease: false
